<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 116" width="1200" height="116" role="img" aria-label="27+ public repositories, 10+ projects shipped, 3+ years in CS and AI, 150+ coding challenges solved, 14k+ pixels built.">
<title>By the numbers</title>
<defs>
  <clipPath id="card"><rect width="1200" height="116" rx="16"/></clipPath>

  <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#F5A84B"/>
    <stop offset="1"   stop-color="#EA865E"/>
  </linearGradient>
  <linearGradient id="brandV" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#F5A84B" stop-opacity="0"/>
    <stop offset="1" stop-color="#EA865E" stop-opacity=".28"/>
  </linearGradient>
  <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F5A84B"/>
    <stop stop-color="#FFD9A8">
      <animate attributeName="offset" values=".05;.95;.05" dur="7s" repeatCount="indefinite"/>
    </stop>
    <stop offset="1" stop-color="#EA865E"/>
  </linearGradient>
  <linearGradient id="topLight" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#F5A84B" stop-opacity="0"/>
    <stop offset=".5"  stop-color="#F5A84B" stop-opacity=".26"/>
    <stop offset="1"   stop-color="#F5A84B" stop-opacity="0"/>
    <animate attributeName="x1" values="-.45;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;1.45" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="haze" cx=".5" cy=".5" r=".5">
    <stop offset="0"   stop-color="#EA865E" stop-opacity=".11"/>
    <stop offset=".55" stop-color="#F5A84B"  stop-opacity=".04"/>
    <stop offset="1"   stop-color="#F5A84B"  stop-opacity="0"/>
  </radialGradient>

  <style>
@font-face{font-family:'Sora';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Poppins';font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}

    /* Sora is the voice; Poppins does the reading. Nothing is tracked out â€”
       both faces are well fitted, and the tracking was doing work a real
       display face should do on its own. The @font-face rules are injected
       per panel by shell(), so each file carries only what it draws. */
    .disp { font-family: Sora, 'Poppins', 'Segoe UI', system-ui, sans-serif; font-weight: 800; }
    .text { font-family: Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; }
    .mono { font-family: Poppins, 'Segoe UI', system-ui, sans-serif; font-weight: 500; }
    .fb   { transform-box: fill-box; transform-origin: center; }

    .rise { animation: rise .95s cubic-bezier(.16,1,.3,1) backwards; }
    @keyframes rise { from { transform: translateY(105%) } }

    .up   { animation: up .62s cubic-bezier(.16,1,.3,1) backwards; }
    @keyframes up { from { opacity: 0; transform: translateY(10px) } }

    .in   { animation: pin .5s cubic-bezier(.2,1.3,.4,1) backwards; }
    @keyframes pin { from { opacity: 0; transform: scale(.7) } }

    .draw { animation: draw 1.2s cubic-bezier(.16,1,.3,1) backwards; }
    @keyframes draw { from { stroke-dashoffset: var(--len, 900) } }

    /* particle cloud: five interleaved buckets share five animations. The
       previous version ran one keyframe per dot with a var()+calc() opacity,
       which is 260 style recalcs a frame. */
    .dot  { animation: dot 5.2s ease-in-out infinite; }
    @keyframes dot { 0%,100%{opacity:.34} 50%{opacity:.8} }

    /* signal running along a connector */
    .sig  { stroke-dasharray: 5 190; animation: sig 5.5s linear infinite; }
    @keyframes sig { from { stroke-dashoffset: 195 } to { stroke-dashoffset: -195 } }

    .breathe { animation: breathe 4.5s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:.4;transform:scale(.9)} 50%{opacity:1;transform:scale(1)} }

    /* the gradient itself slides â€” the only place the brand hue moves */
    .glide { animation: glide 9s ease-in-out infinite; }
    @keyframes glide { 0%,100%{opacity:1} 50%{opacity:.86} }

    /* â”€â”€ ambient layer â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
       Everything below loops forever. All of it is transform or opacity so
       it composites rather than repaints, and nothing runs faster than 4s â€”
       a profile card should feel alive, not restless. */

    /* the arrow leans forward the way a hovered one would */
    .nudge { animation: nudge 4s cubic-bezier(.16,1,.3,1) infinite; }
    @keyframes nudge { 0%,72%,100%{transform:translateX(0)} 80%,88%{transform:translateX(4px)} }

    /* slow vertical drift; phase is set per element */
    .float { animation: float 7s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }

    /* a scale beat, used where the scan passes something */
    .bump  { animation: bump 9s cubic-bezier(.2,1.4,.4,1) infinite; }
    @keyframes bump { 0%,100%{transform:scale(1)} 3%{transform:scale(1.09)} 14%{transform:scale(1)} }

    /* the whole cloud tips a fraction of a degree, so the mesh reads 3D */
    .tip   { animation: tip 16s ease-in-out infinite; }
    @keyframes tip { 0%,100%{transform:rotate(-.7deg) scale(1)} 50%{transform:rotate(.7deg) scale(1.02)} }

    /* chip outline catches the light in sequence */
    .relay { animation: relay 8s ease-out infinite; }
    @keyframes relay { 0%,100%{stroke:#29313C} 4%{stroke:#F5A84B} 16%{stroke:#29313C} }

    /* ghosted index in the card headers, barely breathing */
    .ghost { animation: ghost 8s ease-in-out infinite; }
    @keyframes ghost { 0%,100%{opacity:.05} 50%{opacity:.11} }

    .spin  { animation: spin 22s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }

    @media (prefers-reduced-motion: reduce) {
      .rise,.up,.in,.draw,.dot,.sig,.breathe,.glide,.nudge,.float,.bump,.tip,.relay,.ghost,.spin {
        animation: none !important; stroke-dashoffset: 0 !important;
      }
      .sig { opacity: 0 !important; }
    }
  </style>
</defs>
<g clip-path="url(#card)">
  <rect width="1200" height="116" fill="#0B1017"/>
  <rect width="1200" height="116" fill="#141921"/>
  <g class="up" style="animation-delay:0.00s">

    <text class="mono" x="30" y="46" font-size="10" letter-spacing="0.8" fill="#8A93A0">PUBLIC REPOS</text>
    <text class="disp" x="30" y="80" font-size="29" font-weight="700" letter-spacing="-.8" fill="#F0F4F9">27+</text>
    <path class="draw" style="--len:200;animation-delay:0.40s" stroke-dasharray="200"
          d="M140 72L146 72L152 76L158 80L164 72L170 74L176 72L182 77L188 75L194 68L200 69L206 73L212 63" fill="none" stroke="url(#brand)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle r="2.6" fill="#F5A84B">
      <animateMotion dur="6s" begin="1.40s" repeatCount="indefinite" path="M140 72L146 72L152 76L158 80L164 72L170 74L176 72L182 77L188 75L194 68L200 69L206 73L212 63"/>
      <animate attributeName="opacity" dur="6s" begin="1.40s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;.08;.92;1"/>
    </circle>
  </g>
  <g class="up" style="animation-delay:0.06s">
    <path d="M240 26V90" stroke="#29313C"/>
    <text class="mono" x="270" y="46" font-size="10" letter-spacing="0.8" fill="#8A93A0">PROJECTS SHIPPED</text>
    <text class="disp" x="270" y="80" font-size="29" font-weight="700" letter-spacing="-.8" fill="#F0F4F9">10+</text>
    <path class="draw" style="--len:200;animation-delay:0.49s" stroke-dasharray="200"
          d="M380 61L386 64L392 77L398 64L404 60L410 59L416 67L422 67L428 62L434 78L440 71L446 77L452 58" fill="none" stroke="url(#brand)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle r="2.6" fill="#F5A84B">
      <animateMotion dur="6s" begin="1.75s" repeatCount="indefinite" path="M380 61L386 64L392 77L398 64L404 60L410 59L416 67L422 67L428 62L434 78L440 71L446 77L452 58"/>
      <animate attributeName="opacity" dur="6s" begin="1.75s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;.08;.92;1"/>
    </circle>
  </g>
  <g class="up" style="animation-delay:0.12s">
    <path d="M480 26V90" stroke="#29313C"/>
    <text class="mono" x="510" y="46" font-size="10" letter-spacing="0.8" fill="#8A93A0">YEARS IN CS/AI</text>
    <text class="disp" x="510" y="80" font-size="29" font-weight="700" letter-spacing="-.8" fill="#F0F4F9">3+</text>
    <path class="draw" style="--len:200;animation-delay:0.58s" stroke-dasharray="200"
          d="M620 74L626 59L632 70L638 68L644 69L650 58L656 63L662 76L668 78L674 72L680 62L686 80L692 62" fill="none" stroke="url(#brand)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle r="2.6" fill="#F5A84B">
      <animateMotion dur="6s" begin="2.10s" repeatCount="indefinite" path="M620 74L626 59L632 70L638 68L644 69L650 58L656 63L662 76L668 78L674 72L680 62L686 80L692 62"/>
      <animate attributeName="opacity" dur="6s" begin="2.10s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;.08;.92;1"/>
    </circle>
  </g>
  <g class="up" style="animation-delay:0.18s">
    <path d="M720 26V90" stroke="#29313C"/>
    <text class="mono" x="750" y="46" font-size="10" letter-spacing="0.8" fill="#8A93A0">PROBLEMS SOLVED</text>
    <text class="disp" x="750" y="80" font-size="29" font-weight="700" letter-spacing="-.8" fill="#F0F4F9">150+</text>
    <path class="draw" style="--len:200;animation-delay:0.67s" stroke-dasharray="200"
          d="M860 77L866 78L872 66L878 59L884 77L890 76L896 67L902 79L908 63L914 69L920 59L926 58L932 78" fill="none" stroke="url(#brand)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle r="2.6" fill="#F5A84B">
      <animateMotion dur="6s" begin="2.45s" repeatCount="indefinite" path="M860 77L866 78L872 66L878 59L884 77L890 76L896 67L902 79L908 63L914 69L920 59L926 58L932 78"/>
      <animate attributeName="opacity" dur="6s" begin="2.45s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;.08;.92;1"/>
    </circle>
  </g>
  <g class="up" style="animation-delay:0.24s">
    <path d="M960 26V90" stroke="#29313C"/>
    <text class="mono" x="990" y="46" font-size="10" letter-spacing="0.8" fill="#8A93A0">PORTFOLIO DEPTH</text>
    <text class="disp" x="990" y="80" font-size="29" font-weight="700" letter-spacing="-.8" fill="#F0F4F9">14k+</text>
    <circle cx="1138" cy="70" r="17" fill="none" stroke="#29313C" stroke-width="4"/>
    <circle class="draw spin fb" style="--len:108;animation-delay:0.76s,0s" cx="1138" cy="70" r="17"
            fill="none" stroke="url(#brand)" stroke-width="4" stroke-dasharray="108" stroke-linecap="round"/>
  </g>
  <path d="M18 .75H1182" stroke="url(#topLight)" stroke-width="1.5" fill="none"/>
  <rect width="1199" height="115" x=".5" y=".5" rx="16" fill="none" stroke="#29313C"/>
</g>
</svg>
